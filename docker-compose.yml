services:
  db:
    image: postgres:16
    container_name: cloud-scheduler-db
    environment:
      POSTGRES_DB: cloud_scheduler
      POSTGRES_USER: scheduler_user
      POSTGRES_PASSWORD: scheduler_dev_password
    ports:
      - "5432:5432"
    volumes:
      - scheduler_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_user -d cloud_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    container_name: cloud-scheduler-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cloud_scheduler
      SPRING_DATASOURCE_USERNAME: scheduler_user
      SPRING_DATASOURCE_PASSWORD: scheduler_dev_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
    ports:
      - "8080:8080"
volumes:
  scheduler_data:
