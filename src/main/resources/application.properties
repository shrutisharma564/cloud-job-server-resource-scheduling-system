spring.application.name=cloud-job-server-scheduling
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloud_scheduler}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scheduler_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scheduler_dev_password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
